version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - skip: true

archives:
  - format: tar.gz

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: aqylsoft
    name: once
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  extra_files:
    - glob: ./cgo/libonce.so
    - glob: ./cgo/libonce.h
